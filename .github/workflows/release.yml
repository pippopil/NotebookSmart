name: Automatic GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Номер релиза (например: v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  create-release:
    name: Create & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production Assets
        run: npm run build

      - name: Determine Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Archive Production Build
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          cd dist && zip -r ../notebook-smart-pwa-${{ steps.vars.outputs.tag }}.zip ./* && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: 'Релиз NotebookSmart ${{ steps.vars.outputs.tag }}'
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            notebook-smart-pwa-${{ steps.vars.outputs.tag }}.zip
            capacitor.config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
