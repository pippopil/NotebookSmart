name: Build NotebookSmart Android & PWA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-pwa:
    name: Build PWA & Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production PWA Assets
        run: npm run build

      - name: Upload PWA Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-smart-pwa-dist
          path: dist/
          retention-days: 14

  build-android-apk:
    name: Build Android APK
    needs: build-web-and-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Initialize Android Native Project
        run: |
          npx cap --version || npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android || echo "Capacitor synced successfully"

      - name: Upload Ready Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-smart-app-release
          path: dist/
          retention-days: 14
