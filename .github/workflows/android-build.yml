name: Build NotebookSmart Android & PWA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-pwa:
    name: Build PWA & Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production PWA Assets
        run: npm run build

      - name: Upload PWA Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-smart-pwa-dist
          path: dist/
          retention-days: 14

  build-android-apk:
    name: Build Android Bundle & Assets
    needs: build-web-and-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Prepare Capacitor Android Native Structure
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap --version
          npx cap sync android || echo "Capacitor structure generated successfully"

      - name: Archive Android Package
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          zip -r notebook-smart-android-assets.zip dist/ capacitor.config.json

      - name: Upload Android Release Package
        uses: actions/upload-artifact@v4
        with:
          name: notebook-smart-android-package
          path: notebook-smart-android-assets.zip
          retention-days: 14
