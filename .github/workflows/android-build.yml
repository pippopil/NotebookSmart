name: Build NotebookSmart Android APK & PWA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-pwa-and-apk:
    name: Build PWA Web & Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web & PWA
        run: npm run build

      - name: Upload PWA Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-smart-pwa-dist
          path: dist/
          retention-days: 14

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./NotebookSmart-debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotebookSmart-debug-apk
          path: NotebookSmart-debug.apk
          retention-days: 30
