<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Notepad Document -->
  <g filter="url(#shadow)">
    <rect x="110" y="86" width="292" height="340" rx="28" fill="url(#page)"/>
    
    <!-- Notepad Binder rings -->
    <circle cx="86" cy="150" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/>
    <circle cx="86" cy="230" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/>
    <circle cx="86" cy="310" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/>
    <circle cx="86" cy="390" r="14" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/>
    
    <line x1="86" y1="150" x2="114" y2="150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="86" y1="230" x2="114" y2="230" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="86" y1="310" x2="114" y2="310" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="86" y1="390" x2="114" y2="390" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Note lines with checkmarks and math tags -->
    <!-- Row 1: Grocery item -->
    <rect x="146" y="142" width="20" height="20" rx="5" fill="#10b981"/>
    <polyline points="151,152 155,157 162,147" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="180" y1="152" x2="310" y2="152" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Cart badge -->
    <rect x="326" y="138" width="54" height="26" rx="8" fill="#e0e7ff"/>
    <text x="353" y="156" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="middle">🛒 КОРЗИНА</text>

    <!-- Row 2: Math payment -->
    <line x1="148" y1="206" x2="250" y2="206" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <rect x="268" y="192" width="112" height="28" rx="8" fill="#fef3c7"/>
    <text x="324" y="211" font-family="system-ui, monospace" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">= 1 450 ₽</text>

    <!-- Row 3: Math payment -->
    <line x1="148" y1="260" x2="260" y2="260" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <rect x="280" y="246" width="100" height="28" rx="8" fill="#dcfce7"/>
    <text x="330" y="265" font-family="system-ui, monospace" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">= 35 000 ₽</text>

    <!-- Row 4: Grocery list items -->
    <line x1="148" y1="314" x2="320" y2="314" stroke="#64748b" stroke-width="5" stroke-dasharray="1 8" stroke-linecap="round"/>
    <line x1="148" y1="356" x2="290" y2="356" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <!-- Bottom summary banner in note -->
    <rect x="140" y="380" width="232" height="32" rx="10" fill="#4f46e5"/>
    <text x="256" y="401" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ИТОГО: 36 450 ₽</text>
  </g>
</svg>
