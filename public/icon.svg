<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Notebook Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Graph Paper Grid Pattern (5mm math grid "в клеточку") -->
    <pattern id="mathGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#93c5fd" stroke-width="0.8" opacity="0.65"/>
    </pattern>

    <!-- Metallic Spiral Gradient -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Neon Glow Effects -->
    <filter id="shadowPaper" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Subtle ambient glow in background -->
  <circle cx="380" cy="140" r="160" fill="#6366f1" opacity="0.2" filter="blur(60px)"/>
  <circle cx="160" cy="380" r="140" fill="#10b981" opacity="0.16" filter="blur(50px)"/>

  <!-- Тетрадь в клеточку (Grid Graph Notebook) -->
  <g filter="url(#shadowPaper)">
    <!-- Base Paper Sheet -->
    <rect x="96" y="74" width="324" height="364" rx="24" fill="url(#paperGrad)"/>

    <!-- Graph Grid Texture overlay inside the notebook page -->
    <rect x="96" y="74" width="324" height="364" rx="24" fill="url(#mathGrid)"/>

    <!-- Красные поля тетради (Classic Red Notebook Margin Line) -->
    <line x1="168" y1="74" x2="168" y2="438" stroke="#ef4444" stroke-width="2.5" opacity="0.85"/>

    <!-- Spiral Binder Ring Holes & Metal Rings on the Left Edge -->
    <!-- Rings at Y = 120, 180, 240, 300, 360 -->
    <g>
      <!-- Holes -->
      <circle cx="120" cy="120" r="7" fill="#0f172a" opacity="0.75"/>
      <circle cx="120" cy="180" r="7" fill="#0f172a" opacity="0.75"/>
      <circle cx="120" cy="240" r="7" fill="#0f172a" opacity="0.75"/>
      <circle cx="120" cy="300" r="7" fill="#0f172a" opacity="0.75"/>
      <circle cx="120" cy="360" r="7" fill="#0f172a" opacity="0.75"/>

      <!-- Spiral Wire loops -->
      <path d="M 82 110 C 82 100, 120 102, 120 120 C 120 134, 82 130, 82 110" fill="none" stroke="url(#metalRing)" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 82 170 C 82 160, 120 162, 120 180 C 120 194, 82 190, 82 170" fill="none" stroke="url(#metalRing)" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 82 230 C 82 220, 120 222, 120 240 C 120 254, 82 250, 82 230" fill="none" stroke="url(#metalRing)" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 82 290 C 82 280, 120 282, 120 300 C 120 314, 82 310, 82 290" fill="none" stroke="url(#metalRing)" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 82 350 C 82 340, 120 342, 120 360 C 120 374, 82 370, 82 350" fill="none" stroke="url(#metalRing)" stroke-width="6.5" stroke-linecap="round"/>
    </g>

    <!-- CONTENT ELEMENT 1: События / Календарь (Events tag) -->
    <g transform="translate(186, 108)">
      <rect width="104" height="26" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="24" height="26" rx="8" fill="#6366f1"/>
      <text x="12" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">10</text>
      <text x="64" y="17" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">СОБЫТИЯ</text>
    </g>

    <!-- CONTENT ELEMENT 2: Покупки (Shopping checklist with checkmark) -->
    <g transform="translate(186, 154)" filter="url(#emeraldGlow)">
      <!-- Checkbox -->
      <rect x="0" y="2" width="22" height="22" rx="6" fill="#10b981"/>
      <path d="M 5 12 L 9 17 L 17 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Shopping item text line -->
      <rect x="30" y="6" width="108" height="6" rx="3" fill="#334155"/>
      <rect x="30" y="16" width="70" height="4" rx="2" fill="#94a3b8"/>
      
      <!-- Cart Icon Mini Badge -->
      <rect x="146" y="0" width="58" height="24" rx="7" fill="#d1fae5"/>
      <text x="175" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">🛒 ПОКУПКИ</text>
    </g>

    <!-- Grid row separator line -->
    <line x1="186" y1="202" x2="396" y2="202" stroke="#cbd5e1" stroke-dasharray="3 3" stroke-width="1.5"/>

    <!-- CONTENT ELEMENT 3: Умный расчет оплат (Live Math Evaluation Badge) -->
    <g transform="translate(186, 222)" filter="url(#neonGlow)">
      <!-- Expression: 450 + 1200 -->
      <rect x="0" y="6" width="80" height="6" rx="3" fill="#475569"/>
      <rect x="0" y="16" width="60" height="5" rx="2.5" fill="#64748b"/>

      <!-- Glowing Result Pill: = 1 650 ₽ -->
      <rect x="92" y="-2" width="118" height="30" rx="10" fill="#4f46e5"/>
      <text x="151" y="18" font-family="system-ui, monospace, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">= 1 650 ₽</text>
    </g>

    <!-- CONTENT ELEMENT 4: Просто заметки (Text lines in grid) -->
    <g transform="translate(186, 276)">
      <line x1="0" y1="8" x2="200" y2="8" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="24" x2="160" y2="24" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="0" y1="40" x2="180" y2="40" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Bottom Total Grand Summary Banner -->
    <g transform="translate(160, 364)">
      <rect width="236" height="42" rx="14" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="26" cy="21" r="12" fill="#10b981" opacity="0.2"/>
      <text x="26" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">✓</text>
      
      <text x="50" y="19" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1">ИТОГО К ОПЛАТЕ</text>
      <text x="50" y="34" font-family="system-ui, monospace, sans-serif" font-size="15" font-weight="900" fill="#38bdf8">36 450 ₽</text>

      <!-- Smart Tag -->
      <rect x="176" y="11" width="48" height="20" rx="6" fill="#4338ca"/>
      <text x="200" y="25" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#e0e7ff" text-anchor="middle">SMART</text>
    </g>
  </g>
</svg>
